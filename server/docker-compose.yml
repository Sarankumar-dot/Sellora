services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: node --watch src/server.js
    env_file:
      - .env
    ports:
      - '${PORT:-5000}:5000'
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  backend_node_modules: {}
