<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sellora - Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dbdad9",

                        "on-error-container": "#93000a",
                        "on-secondary-container": "#783920",
                        "surface-container": "#efeded",
                        "on-surface": "#1b1c1c",
                        "surface": "#fbf9f9",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#000000",
                        "primary": "#000000",
                        "on-secondary-fixed": "#380d00",
                        "secondary-fixed-dim": "#ffb59a",
                        "on-primary-fixed-variant": "#474746",
                        "surface-container-low": "#f5f3f3",
                        "surface-container-high": "#e9e8e7",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-container-highest": "#e3e2e2",
                        "on-tertiary-fixed-variant": "#464746",
                        "primary-fixed-dim": "#c8c6c5",
                        "background": "#fbf9f9",
                        "tertiary-fixed-dim": "#c7c6c5",
                        "outline": "#747878",
                        "tertiary-container": "#1a1c1b",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#e5e2e1",
                        "inverse-surface": "#303031",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#838482",
                        "on-primary-container": "#858383",
                        "surface-variant": "#e3e2e2",
                        "inverse-primary": "#c8c6c5",
                        "secondary-fixed": "#ffdbce",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#5f5e5e",
                        "primary-container": "#1c1b1b",
                        "outline-variant": "#c4c7c7",
                        "on-tertiary-fixed": "#1a1c1b",
                        "on-secondary-fixed-variant": "#72351c",
                        "tertiary-fixed": "#e3e2e0",
                        "surface-bright": "#fbf9f9",
                        "on-surface-variant": "#444748",
                        "on-error": "#ffffff",
                        "secondary": "#904c31",
                        "on-background": "#1b1c1c",
                        "on-primary-fixed": "#1c1b1b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-mobile": "16px",
                        "unit": "8px",
                        "gutter-desktop": "32px",
                        "margin-mobile": "20px",
                        "container-max": "1280px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Playfair Display"],
                        "body-md": ["Inter"],

<style>
        .input-field {
            @apply w-full bg-surface border border-outline-variant text-on-surface rounded-DEFAULT px-4 py-3 focus:outline-none focus:border-primary transition-colors font-body-md;
        }
        .role-btn {
            @apply flex-1 py-3 text-center border rounded-DEFAULT font-label-md transition-colors cursor-pointer;
        }
        .role-btn.active {
            @apply bg-primary text-on-primary border-primary;
        }
        .role-btn.inactive {
            @apply bg-surface text-on-surface-variant border-outline-variant hover:bg-surface-container;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:hidden selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Header (Transactional - No Shell Navs) -->
<header class="w-full flex justify-center items-center py-6 border-b border-surface-container">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Sellora</h1>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-margin-mobile py-8 pb-20">
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-primary mb-2">Create an Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join our curated marketplace.</p>
</div>
<form class="flex flex-col gap-5" id="registerForm" onsubmit="event.preventDefault();">
<!-- Role Selection -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface">I want to</label>
<div class="flex gap-4">
<button class="role-btn active" id="roleBuyer" onclick="setRole('buyer')" type="button">Buy</button>
<button class="role-btn inactive" id="roleSeller" onclick="setRole('seller')" type="button">Sell</button>
</div>
<input id="selectedRole" name="role" type="hidden" value="buyer"/>
</div>
<!-- Full Name -->
<div class="space-y-1 mt-2">
<label class="font-label-sm text-label-sm text-on-surface" for="fullName">Full Name</label>
<input class="input-field" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email Address -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<input class="input-field" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Mobile Number -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface" for="mobile">Mobile Number</label>
<input class="input-field" id="mobile" name="mobile" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
<!-- Password -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<input class="input-field pr-12" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Must be at least 8 characters.</p>
</div>
<!-- Submit CTA -->
<button class="mt-6 w-full bg-primary text-on-primary py-4 rounded-DEFAULT font-label-md text-label-md hover:bg-surface-tint transition-colors shadow-sm" type="submit">
                Register
            </button>
<div class="text-center mt-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? <a class="text-primary font-semibold underline decoration-outline-variant underline-offset-4" href="#">Log in</a>
</p>
</div>
</form>
</main>
<script>
        function setRole(role) {
            const btnBuyer = document.getElementById('roleBuyer');
            const btnSeller = document.getElementById('roleSeller');
            const inputRole = document.getElementById('selectedRole');

            if (role === 'buyer') {
                btnBuyer.className = 'role-btn active';
                btnSeller.className = 'role-btn inactive';
                inputRole.value = 'buyer';
            } else {
                btnSeller.className = 'role-btn active';
                btnBuyer.className = 'role-btn inactive';
                inputRole.value = 'seller';
            }
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const visIcon = document.getElementById('visibilityIcon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                visIcon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                visIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
