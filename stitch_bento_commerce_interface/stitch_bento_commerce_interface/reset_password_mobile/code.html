<body class="bg-background text-on-background h-full flex flex-col antialiased">
<!-- TopAppBar Structure (Derived from Shared Component, modified for transactional flow) -->
<header class="w-full top-0 bg-surface text-primary flex justify-center items-center h-20 px-margin-mobile border-b border-surface-variant/50 sticky z-50">
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-tight text-primary">Sellora</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile py-12 max-w-md mx-auto w-full">
<div class="mb-10 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-2">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please create a new password that you don't use on any other site.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="new_password">New Password</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant focus:border-primary focus:ring-0 rounded p-4 font-body-md text-body-md transition-colors" id="new_password" name="new_password" placeholder="Enter new password" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant focus:border-primary focus:ring-0 rounded p-4 font-body-md text-body-md transition-colors" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<div class="mt-4">
<button class="w-full bg-primary text-on-primary rounded p-4 font-label-md text-label-md hover:opacity-90 transition-opacity flex justify-center items-center gap-2" type="submit">
                    Update Password
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_right_alt">arrow_right_alt</span>
</button>
</div>
<div class="text-center mt-6">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant hover:decoration-primary underline-offset-4" href="#">Back to Sign In</a>
</div>
</form>
</main>
<!-- Navigation Shell Suppressed: Transactional intent (Reset Password). User is in a focused journey. -->
