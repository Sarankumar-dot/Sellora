<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Checkout - Sellora</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1b1c1c",
                        "outline-variant": "#c4c7c7",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#c7c6c5",
                        "on-tertiary-fixed": "#1a1c1b",
                        "secondary": "#904c31",
                        "on-primary-fixed": "#1c1b1b",
                        "on-surface-variant": "#444748",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#c8c6c5",
                        "error": "#ba1a1a",
                        "on-surface": "#1b1c1c",
                        "inverse-on-surface": "#f2f0f0",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#464746",
                        "outline": "#747878",
                        "secondary-fixed": "#ffdbce",
                        "surface-tint": "#5f5e5e",
                        "surface-container-highest": "#e3e2e2",
                        "tertiary-fixed": "#e3e2e0",
                        "surface-container-low": "#f5f3f3",
                        "tertiary-container": "#1a1c1b",
                        "on-secondary": "#ffffff",
                        "tertiary": "#000000",
                        "surface-dim": "#dbdad9",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#474746",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#72351c",
                        "on-secondary-fixed": "#380d00",
                        "surface-container": "#efeded",
                        "background": "#fbf9f9",
                        "surface-bright": "#fbf9f9",
                        "inverse-surface": "#303031",
                        "surface": "#fbf9f9",
                        "secondary-container": "#fea685",
                        "on-secondary-container": "#783920",
                        "primary": "#000000",
                        "surface-container-high": "#e9e8e7",
                        "primary-container": "#1c1b1b",
                        "on-tertiary-container": "#838482",
                        "surface-variant": "#e3e2e2",
                        "primary-fixed": "#e5e2e1",
                        "on-primary-container": "#858383",
                        "secondary-fixed-dim": "#ffb59a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-desktop": "32px",
                        "gutter-mobile": "16px",
                        "margin-mobile": "20px",
                        "unit": "8px",
                        "container-max": "1280px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Playfair Display"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Playfair Display"],
                        "display-lg-mobile": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "display-lg-mobile": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #fbf9f9; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-32">
<!-- Top Navigation (Mobile Simplified for Checkout) -->
<header class="bg-surface sticky top-0 z-40">
<div class="px-margin-mobile h-16 flex items-center justify-between border-b border-surface-container-high">
<button aria-label="Go back" class="text-on-surface-variant flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Checkout</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-lg mx-auto px-margin-mobile pt-6 flex flex-col gap-unit-6 pb-margin-desktop">
<!-- Step 1: Shipping Address -->
<section class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_12px_rgba(26,26,26,0.03)] border border-surface-container">
<div class="flex items-center justify-between mb-4">
<h2 class="font-label-md text-label-md text-primary uppercase tracking-wider flex items-center gap-2">
<span class="bg-primary text-on-primary w-6 h-6 rounded-full flex items-center justify-center text-[10px]">1</span>
                    Shipping Address
                </h2>
<!-- Edit button would go here if completed -->
</div>
<form class="space-y-4">
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="first-name">First Name</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="first-name" placeholder="Jane" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="last-name">Last Name</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="last-name" placeholder="Doe" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="address">Street Address</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="address" placeholder="123 Minimalist Way" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="apartment">Apartment, suite, etc. (optional)</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="apartment" placeholder="Apt 4B" type="text"/>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="city">City</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="city" placeholder="New York" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="zip">ZIP Code</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="zip" placeholder="10001" type="text"/>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg transition-transform active:scale-[0.98]" type="button">
                        Save & Continue
                    </button>
</div>
</form>
</section>
<!-- Step 2: Payment (Inactive State for demo) -->
<section class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_12px_rgba(26,26,26,0.03)] border border-surface-container opacity-60">
<div class="flex items-center justify-between">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider flex items-center gap-2">
<span class="bg-surface-container-high text-on-surface-variant w-6 h-6 rounded-full flex items-center justify-center text-[10px]">2</span>
                    Payment Method
                </h2>
</div>
<!-- Expanded content would be hidden normally until Step 1 is done -->
<div class="hidden mt-4">
<button class="w-full bg-[#3399cc] text-white font-label-md text-label-md py-3 rounded-lg flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]">payment</span>
                    Pay with Razorpay
                </button>
</div>
</section>
<!-- Step 3: Review (Inactive State) -->
<section class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_12px_rgba(26,26,26,0.03)] border border-surface-container opacity-60 mb-8">
<div class="flex items-center justify-between">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider flex items-center gap-2">
<span class="bg-surface-container-high text-on-surface-variant w-6 h-6 rounded-full flex items-center justify-center text-[10px]">3</span>
                    Review Order
                </h2>
</div>
</section>
<!-- Order Summary -->
<section class="mt-4 pt-6 border-t border-surface-container-high">
<h3 class="font-headline-md text-headline-md text-primary mb-4">Order Summary</h3>
<!-- Item -->
<div class="flex gap-4 mb-4">
<div class="w-20 h-24 bg-surface-container-low rounded-lg overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A beautifully crafted ceramic vase, minimalist design, off-white with subtle texturing, resting on a clean wooden surface, well-lit studio lighting, quiet luxury aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDh4fH0Zk1xvr0_Fng1sDzCqGmQ5FXXF37UHbEkxCSsnU5QLKmTFPzInQBt47mUKvjl866juAUUX3h-PxR_Zhf4CiLjt54S1PwLmux2MRbKW0KGhjKERCFqcRuIdBUwfHoPJbwYYw-dG5mhH1-YXEQAByQtaUxglQwzl0IsVivCc0q8S39eDxXEGWBzJqp-sSedxYE8b8xpGUULPVef1pzXMZuo9qNPBJ5WBZY0OlyXYX-RrfH4MFs6qw"/>
</div>
<div class="flex-1 flex flex-col justify-between py-1">
<div>
<h4 class="font-body-md text-body-md text-primary font-medium">Ceramic Vase</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Color: Bone White</p>
</div>
<div class="flex justify-between items-center mt-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">Qty: 1</span>
<span class="font-body-md text-body-md text-primary">$85.00</span>
</div>
</div>
</div>
<!-- Totals -->
<div class="space-y-2 mt-6 font-body-md text-body-md">
<div class="flex justify-between text-on-surface-variant">
<span>Subtotal</span>
<span>$85.00</span>
</div>
<div class="flex justify-between text-on-surface-variant">
<span>Shipping</span>
<span>Calculated at next step</span>
</div>
<div class="flex justify-between text-on-surface-variant">
<span>Tax</span>
<span>$0.00</span>
</div>
<div class="flex justify-between text-primary font-medium pt-4 border-t border-surface-container mt-4">
<span>Total</span>
<span class="font-headline-md text-[20px]">$85.00</span>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-container p-margin-mobile pb-8 shadow-[0_-10px_30px_rgba(26,26,26,0.05)] z-50">
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-2 transition-transform active:scale-[0.98] shadow-sm">
            Continue to Payment
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</body></html>
