<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sellora - Seller Onboarding</title>

                    "borderRadius": {

                        "gutter-desktop": "32px",

                        "margin-desktop": "64px"
                    },
                    "fontFamily": {

<style>
        /* Custom styles for subtle UI enhancements */
        .glass-panel {
            background: rgba(251, 249, 249, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col relative pb-32">
<!-- Minimal Header (Transactional Intent: Navigation Suppressed) -->
<header class="w-full px-margin-mobile pt-8 pb-4 flex justify-between items-center sticky top-0 z-40 glass-panel border-b border-surface-container-high">
<div class="font-display-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Sellora</div>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">Step 1 of 3</span>
<div class="w-12 h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-primary rounded-full"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile pt-8 flex flex-col gap-10">
<!-- Page Title -->
<div class="space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Establish your presence.</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Provide a few details to create your bespoke storefront.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-8">
<!-- Section: Identity -->
<section class="space-y-6">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-surface-container-high pb-2">Identity</h2>
<!-- Logo Upload -->
<div class="space-y-3">
<label class="font-label-sm text-label-sm text-on-surface block">Store Logo</label>
<div class="group relative w-full h-40 rounded-lg border border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center cursor-pointer hover:border-primary hover:bg-surface transition-all duration-300">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-3xl mb-2" style="font-variation-settings: 'FILL' 0;">add_photo_alternate</span>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">Tap to upload</span>
<span class="font-label-sm text-label-sm text-outline mt-1 font-normal">PNG or JPG, up to 5MB</span>
<input accept="image/png, image/jpeg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<!-- Store Name -->
<div class="space-y-2 relative">
<label class="font-label-sm text-label-sm text-on-surface block" for="store_name">Store Name</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="store_name" placeholder="e.g., The Artisan Collective" type="text"/>
</div>
<!-- Description -->
<div class="space-y-2 relative">
<label class="font-label-sm text-label-sm text-on-surface block" for="store_desc">Brand Story (Description)</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none" id="store_desc" placeholder="Briefly describe your products and brand ethos..." rows="3"></textarea>
</div>
</section>
<!-- Section: Compliance -->
<section class="space-y-6 pt-4">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-surface-container-high pb-2">Compliance</h2>
<!-- GST Number -->
<div class="space-y-2 relative">
<label class="font-label-sm text-label-sm text-on-surface block" for="gst_number">GSTIN</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all uppercase" id="gst_number" placeholder="15-character GST Number" type="text"/>
</div>
<!-- PAN -->
<div class="space-y-2 relative">
<label class="font-label-sm text-label-sm text-on-surface block" for="pan_number">PAN</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all uppercase" id="pan_number" placeholder="10-character PAN" type="text"/>
</div>
</section>
<!-- Section: Location -->
<section class="space-y-6 pt-4">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-surface-container-high pb-2">Location</h2>
<!-- Address -->
<div class="space-y-2 relative">
<label class="font-label-sm text-label-sm text-on-surface block" for="address">Registered Address</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none" id="address" placeholder="Street address, City, Pincode" rows="3"></textarea>
</div>
</section>
</form>
</main>
<!-- Sticky Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-md border-t border-surface-container shadow-[0_-10px_30px_rgba(26,26,26,0.03)] z-50 px-margin-mobile py-4 pb-8">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm">
<span>Continue to Payout Details</span>
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</body></html>
