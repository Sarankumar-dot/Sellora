<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Product - Sellora Seller</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#1b1c1c",
                      "outline-variant": "#c4c7c7",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed-dim": "#c7c6c5",
                      "on-tertiary-fixed": "#1a1c1b",
                      "secondary": "#904c31",
                      "on-primary-fixed": "#1c1b1b",
                      "on-surface-variant": "#444748",
                      "on-error": "#ffffff",
                      "on-primary": "#ffffff",
                      "primary-fixed-dim": "#c8c6c5",
                      "error": "#ba1a1a",
                      "on-surface": "#1b1c1c",
                      "inverse-on-surface": "#f2f0f0",
                      "inverse-primary": "#c8c6c5",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed-variant": "#464746",
                      "outline": "#747878",
                      "secondary-fixed": "#ffdbce",
                      "surface-tint": "#5f5e5e",
                      "surface-container-highest": "#e3e2e2",
                      "tertiary-fixed": "#e3e2e0",
                      "surface-container-low": "#f5f3f3",
                      "tertiary-container": "#1a1c1b",
                      "on-secondary": "#ffffff",
                      "tertiary": "#000000",
                      "surface-dim": "#dbdad9",
                      "on-error-container": "#93000a",
                      "on-primary-fixed-variant": "#474746",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed-variant": "#72351c",
                      "on-secondary-fixed": "#380d00",
                      "surface-container": "#efeded",
                      "background": "#fbf9f9",
                      "surface-bright": "#fbf9f9",
                      "inverse-surface": "#303031",
                      "surface": "#fbf9f9",
                      "secondary-container": "#fea685",
                      "on-secondary-container": "#783920",
                      "primary": "#000000",
                      "surface-container-high": "#e9e8e7",
                      "primary-container": "#1c1b1b",
                      "on-tertiary-container": "#838482",
                      "surface-variant": "#e3e2e2",
                      "primary-fixed": "#e5e2e1",
                      "on-primary-container": "#858383",
                      "secondary-fixed-dim": "#ffb59a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter-desktop": "32px",
                      "gutter-mobile": "16px",
                      "margin-mobile": "20px",
                      "unit": "8px",
                      "container-max": "1280px",
                      "margin-desktop": "64px"
              },
              "fontFamily": {
                      "headline-md": ["Playfair Display"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-lg": ["Playfair Display"],
                      "display-lg-mobile": ["Playfair Display"],
                      "display-lg": ["Playfair Display"],
                      "label-md": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "500"}],
                      "display-lg-mobile": ["40px", {"lineHeight": "1.2", "fontWeight": "600"}],
                      "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}]
              }
            },
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1a1c1b;
            box-shadow: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- Top Navigation (Mobile App style Header) -->
<header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-sm border-b border-surface-container-highest px-margin-mobile py-4 flex items-center justify-between">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">New Product</h1>
<button class="p-2 -mr-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="px-margin-mobile py-6 space-y-10">
<!-- General Info Section -->
<section class="space-y-6">
<h2 class="font-headline-md text-headline-md text-primary">General Information</h2>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="title">Product Title</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-background placeholder-outline transition-colors focus:border-primary focus:ring-0" id="title" placeholder="e.g., Hand-poured Soy Candle" type="text"/>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="description">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-background placeholder-outline transition-colors focus:border-primary focus:ring-0" id="description" placeholder="Describe your product..." rows="5"></textarea>
</div>
</section>
<hr class="border-surface-container-high"/>
<!-- Media Section -->
<section class="space-y-6">
<div class="flex justify-between items-end">
<h2 class="font-headline-md text-headline-md text-primary">Media</h2>
<span class="font-label-sm text-label-sm text-on-surface-variant">0 / 8</span>
</div>
<div class="grid grid-cols-3 gap-3">
<!-- Upload Button -->
<button class="aspect-square bg-surface-container-low border border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="font-label-sm text-label-sm">Add Media</span>
</button>
<!-- Placeholder for images -->
<div class="aspect-square bg-surface-container-highest rounded-lg"></div>
<div class="aspect-square bg-surface-container-highest rounded-lg"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Upload images or videos. High resolution recommended.</p>
</section>
<hr class="border-surface-container-high"/>
<!-- Pricing & Inventory Section -->
<section class="space-y-6">
<h2 class="font-headline-md text-headline-md text-primary">Pricing &amp; Inventory</h2>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="price">Price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant">$</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-8 pr-4 py-3 font-body-md text-body-md text-on-background placeholder-outline transition-colors focus:border-primary focus:ring-0" id="price" placeholder="0.00" type="number"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="compare_price">Compare at price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant">$</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-8 pr-4 py-3 font-body-md text-body-md text-on-background placeholder-outline transition-colors focus:border-primary focus:ring-0" id="compare_price" placeholder="0.00" type="number"/>
</div>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="sku">SKU (Stock Keeping Unit)</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-background placeholder-outline transition-colors focus:border-primary focus:ring-0" id="sku" placeholder="Optional" type="text"/>
</div>
<div class="flex items-center justify-between py-2 border-b border-surface-container-high">
<label class="font-body-md text-body-md text-on-background cursor-pointer" for="track_qty">Track quantity</label>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-outline-variant checked:border-primary checked:right-0 right-6 z-10 transition-all duration-300" id="track_qty" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-highest cursor-pointer transition-colors duration-300" for="track_qty"></label>
</div>
<style>
                    .toggle-checkbox:checked + .toggle-label {
                        background-color: #000000;
                    }
                    .toggle-checkbox:checked {
                        border-color: #000000;
                    }
                </style>
</div>
<div class="space-y-2 pt-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="quantity">Available Quantity</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-background placeholder-outline transition-colors focus:border-primary focus:ring-0" id="quantity" type="number" value="0"/>
</div>
</section>
<hr class="border-surface-container-high"/>
<!-- Organization Section -->
<section class="space-y-6">
<h2 class="font-headline-md text-headline-md text-primary">Organization</h2>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="category">Product Category</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-background appearance-none transition-colors focus:border-primary focus:ring-0" id="category">
<option>Select a category</option>
<option>Home &amp; Garden</option>
<option>Apparel</option>
<option>Accessories</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="tags">Tags</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-background placeholder-outline transition-colors focus:border-primary focus:ring-0" id="tags" placeholder="e.g., handmade, vintage, summer" type="text"/>
<p class="font-label-sm text-label-sm text-on-surface-variant pt-1">Separate tags with a comma.</p>
</div>
</section>
</main>
<!-- Sticky Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-md border-t border-surface-container-highest p-margin-mobile pb-8 z-50 shadow-[0_-10px_30px_rgba(26,26,26,0.05)]">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]" data-icon="check">check</span>
            Publish Product
        </button>
</div>
</body></html>
