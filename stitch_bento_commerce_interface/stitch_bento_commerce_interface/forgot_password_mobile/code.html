<body class="antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation Anchor (Minimal for Transactional) -->
<header class="w-full fixed top-0 left-0 bg-surface z-50">
<div class="max-w-container-max mx-auto px-margin-mobile flex justify-between items-center h-20">
<!-- Back Action -->
<button aria-label="Go back" class="text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<!-- Brand Logo -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Sellora</h1>
<!-- Empty placeholder to balance flex-between -->
<div class="w-6 h-6"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md w-full mt-24">
<!-- Header Section -->
<div class="text-center mb-12">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-unit">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter the email address associated with your account, and we'll send you a link to reset your password.
            </p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface uppercase" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant focus:border-primary text-on-surface font-body-md text-body-md rounded-DEFAULT py-3 px-4 outline-none transition-colors duration-200 peer placeholder-outline" id="email" name="email" placeholder="hello@example.com" required="" type="email"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-outline peer-focus:text-primary transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md uppercase tracking-wider py-4 rounded-lg hover:opacity-90 transition-opacity duration-200 flex justify-center items-center gap-2 mt-4" type="submit">
                Send Reset Link
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Alternative Actions -->
<div class="mt-8 text-center">
<a class="font-body-md text-body-md text-secondary hover:text-on-secondary-container transition-colors inline-flex items-center gap-1" href="#">
                Return to Login
            </a>
</div>
</main>
<!-- Navigation Shell (BottomNavBar/SideNav) Suppressed: This is a linear/transactional screen -->
<script>
        // Simple form submission prevention for demo purposes
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'Link Sent <span class="material-symbols-outlined text-sm">check</span>';
            btn.classList.add('bg-secondary', 'text-on-secondary');
            btn.classList.remove('bg-primary', 'text-on-primary');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-secondary', 'text-on-secondary');
                btn.classList.add('bg-primary', 'text-on-primary');
            }, 3000);
        });
    </script>
