<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sellora - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1b1c1c",
                        "outline-variant": "#c4c7c7",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#c7c6c5",
                        "on-tertiary-fixed": "#1a1c1b",
                        "secondary": "#904c31",
                        "on-primary-fixed": "#1c1b1b",
                        "on-surface-variant": "#444748",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#c8c6c5",
                        "error": "#ba1a1a",
                        "on-surface": "#1b1c1c",
                        "inverse-on-surface": "#f2f0f0",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#464746",
                        "outline": "#747878",
                        "secondary-fixed": "#ffdbce",
                        "surface-tint": "#5f5e5e",
                        "surface-container-highest": "#e3e2e2",
                        "tertiary-fixed": "#e3e2e0",
                        "surface-container-low": "#f5f3f3",
                        "tertiary-container": "#1a1c1b",
                        "on-secondary": "#ffffff",
                        "tertiary": "#000000",
                        "surface-dim": "#dbdad9",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#474746",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#72351c",
                        "on-secondary-fixed": "#380d00",
                        "surface-container": "#efeded",
                        "background": "#fbf9f9",
                        "surface-bright": "#fbf9f9",
                        "inverse-surface": "#303031",
                        "surface": "#fbf9f9",
                        "secondary-container": "#fea685",
                        "on-secondary-container": "#783920",
                        "primary": "#000000",
                        "surface-container-high": "#e9e8e7",
                        "primary-container": "#1c1b1b",
                        "on-tertiary-container": "#838482",
                        "surface-variant": "#e3e2e2",
                        "primary-fixed": "#e5e2e1",
                        "on-primary-container": "#858383",
                        "secondary-fixed-dim": "#ffb59a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-desktop": "32px",
                        "gutter-mobile": "16px",
                        "margin-mobile": "20px",
                        "unit": "8px",
                        "container-max": "1280px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Playfair Display"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Playfair Display"],
                        "display-lg-mobile": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "display-lg-mobile": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter-mobile md:p-gutter-desktop">
<!-- Suppress TopNavBar & BottomNavBar on Linear/Transactional intent -->
<main class="w-full max-w-md bg-surface-container-lowest p-8 md:p-12 rounded-xl shadow-[0_10px_30px_rgba(26,26,26,0.05)] border border-outline-variant">
<!-- Brand Logo -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Sellora</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center">
<button class="text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors underline-offset-4 hover:underline" href="#">
                        Forgot password?
                    </a>
</div>
</div>
<!-- Submit Button (Terracotta Secondary) -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-secondary bg-secondary hover:bg-on-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors" type="submit">
                    Sign in
                </button>
</div>
</form>
<!-- Create Account Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors underline-offset-4 hover:underline" href="#">
                    Create one now
                </a>
</p>
</div>
</main>
</body></html>
