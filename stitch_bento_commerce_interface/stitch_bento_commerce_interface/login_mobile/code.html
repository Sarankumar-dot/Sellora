<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sellora - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1b1c1c",
                        "outline-variant": "#c4c7c7",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#c7c6c5",
                        "on-tertiary-fixed": "#1a1c1b",
                        "secondary": "#904c31",
                        "on-primary-fixed": "#1c1b1b",
                        "on-surface-variant": "#444748",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#c8c6c5",
                        "error": "#ba1a1a",
                        "on-surface": "#1b1c1c",
                        "inverse-on-surface": "#f2f0f0",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#464746",
                        "outline": "#747878",
                        "secondary-fixed": "#ffdbce",
                        "surface-tint": "#5f5e5e",
                        "surface-container-highest": "#e3e2e2",
                        "tertiary-fixed": "#e3e2e0",
                        "surface-container-low": "#f5f3f3",
                        "tertiary-container": "#1a1c1b",
                        "on-secondary": "#ffffff",
                        "tertiary": "#000000",
                        "surface-dim": "#dbdad9",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#474746",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#72351c",
                        "on-secondary-fixed": "#380d00",
                        "surface-container": "#efeded",
                        "background": "#fbf9f9",
                        "surface-bright": "#fbf9f9",
                        "inverse-surface": "#303031",
                        "surface": "#fbf9f9",
                        "secondary-container": "#fea685",
                        "on-secondary-container": "#783920",
                        "primary": "#000000",
                        "surface-container-high": "#e9e8e7",
                        "primary-container": "#1c1b1b",
                        "on-tertiary-container": "#838482",
                        "surface-variant": "#e3e2e2",
                        "primary-fixed": "#e5e2e1",
                        "on-primary-container": "#858383",
                        "secondary-fixed-dim": "#ffb59a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-desktop": "32px",
                        "gutter-mobile": "16px",
                        "margin-mobile": "20px",
                        "unit": "8px",
                        "container-max": "1280px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Playfair Display"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Playfair Display"],
                        "display-lg-mobile": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "display-lg-mobile": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],

                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #fbf9f9; /* matching theme background */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Suppressed navigation shells (TopNavBar, BottomNavBar) per intent: Linear/Transactional (Login) -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile py-margin-desktop w-full max-w-md mx-auto h-screen sm:h-auto sm:my-auto">
<!-- Brand / Header -->
<div class="text-center mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">Sellora</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Welcome back. Please enter your details.</p>
</div>
<!-- Login Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-background border border-outline-variant text-on-surface rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md placeholder-outline" id="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-background border border-outline-variant text-on-surface rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md placeholder-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password & Remember Me -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-secondary focus:ring-secondary border-outline-variant rounded bg-background cursor-pointer" id="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button (Primary CTA) -->
<div class="pt-4">
<button class="w-full flex justify-center py-4 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-secondary bg-secondary hover:bg-on-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors duration-200" type="submit">
                    Sign in
                </button>
</div>
<!-- Alternative Action -->
<div class="text-center pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors ml-1" href="#">Sign up</a>
</p>
</div>
</form>
</main>
</body></html>
