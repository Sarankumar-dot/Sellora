<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "inverse-primary": "#c8c6c5",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#464746",
                        "outline": "#747878",
                        "secondary-fixed": "#ffdbce",
                        "surface-tint": "#5f5e5e",
                        "surface-container-highest": "#e3e2e2",
                        "tertiary-fixed": "#e3e2e0",

                        "on-secondary": "#ffffff",

                        "on-primary-fixed-variant": "#474746",
                        "error-container": "#ffdad6",

                        "on-secondary-fixed": "#380d00",
                        "surface-container": "#efeded",
                        "background": "#fbf9f9",
                        "surface-bright": "#fbf9f9",
                        "inverse-surface": "#303031",
                        "surface": "#fbf9f9",
                        "secondary-container": "#fea685",
                        "on-secondary-container": "#783920",
                        "primary": "#000000",
                        "surface-container-high": "#e9e8e7",
                        "primary-container": "#1c1b1b",
                        "on-tertiary-container": "#838482",
                        "surface-variant": "#e3e2e2",
                        "primary-fixed": "#e5e2e1",
                        "on-primary-container": "#858383",
                        "secondary-fixed-dim": "#ffb59a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {

                        "gutter-mobile": "16px",

                        "display-lg-mobile": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 selection:bg-secondary selection:text-white">
<!-- Transactional Screen - Suppressing Navigation Shell -->
<main class="w-full max-w-md">
<!-- Minimal Brand Header for Transactional Context -->
<header class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Sellora</h1>
</header>
<!-- Reset Password Card -->
<section class="bg-surface-container-lowest rounded-lg p-8 shadow-[0_10px_30px_rgba(26,26,26,0.05)] border border-surface-variant">
<div class="mb-8 text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter a new password to secure your account.</p>
</div>
<form class="space-y-6">
<!-- New Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2 uppercase tracking-wider" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-background border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline" id="new-password" name="new-password" placeholder="Enter new password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant">Must be at least 8 characters.</p>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2 uppercase tracking-wider" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-background border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline" id="confirm-password" name="confirm-password" placeholder="Confirm new password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary text-white rounded-lg py-4 px-6 font-label-md text-label-md uppercase tracking-widest hover:bg-on-secondary-container transition-colors shadow-sm mt-4 flex items-center justify-center gap-2 group" type="submit">
<span>Update Password</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                     Back to Sign In
                 </a>
</div>
</section>
</main>
<script>
        // Simple password toggle interaction
        document.querySelectorAll('button[aria-label="Toggle password visibility"]').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                }
            });
        });
    </script>
</body></html>
