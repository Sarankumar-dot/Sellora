<!-- Top Nav suppressed for linear/transactional flow per instructions -->

<!-- Atmospheric Background Elements -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-secondary-fixed blur-[120px]"></div>
<div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-primary-fixed blur-[100px]"></div>
</div>
<div class="w-full max-w-md z-10">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_10px_40px_rgba(26,26,26,0.08)] border border-surface-container-high p-8 md:p-10 text-center">
<div class="mb-8 flex justify-center">
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Sellora</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-3">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">
                    Enter your email to reset password
                </p>
<form class="space-y-6 text-left">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<input class="w-full bg-surface text-on-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-md transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-4 rounded-lg hover:bg-on-secondary-container transition-colors shadow-sm flex items-center justify-center gap-2 group" type="submit">
                        Send Reset Link
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8">
<a class="inline-flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                        Back to Login
                    </a>
</div>
</div>
<div class="mt-8 text-center">
<p class="font-label-sm text-label-sm text-outline">

                </p>
</div>
